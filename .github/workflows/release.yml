name: 发布预编译二进制（Release：Linux/macOS/Windows）

# 打 tag 形如 v0.0.1 时，自动为三大平台构建独立二进制并上传到该 Release；
# 也支持在 Actions 页面手动触发（input.tag 指定要挂到的 tag）。
# install.sh 会优先从这里下载对应平台的二进制，下不到再回退源码编译。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要附加二进制的已存在 tag（缺省 v0.0.1）
        required: false
        default: v0.0.1

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64：静态链接(musl)，不依赖目标机 glibc 版本
          - os: ubuntu-latest
            label: linux-x86_64
            asset: coCN-linux-x86_64
            build: 'musl-gcc -static -O2 -Wall -Wextra -o "$ASSET" co.c -lm -lpthread && chmod +x "$ASSET"'
            shell: bash
            deps: 'sudo apt-get update && sudo apt-get install -y musl-tools gcc'
          # Linux arm64：用 arm-runner 原生 gcc 产出真 aarch64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            asset: coCN-linux-aarch64
            build: 'gcc -O2 -Wall -Wextra -o "$ASSET" co.c -lm -lpthread && chmod +x "$ASSET"'
            shell: bash
            deps: 'sudo apt-get update && sudo apt-get install -y gcc'
          # macOS：按 runner 架构分两个（macos-13=x86_64，macos-14=arm64）
          - os: macos-13
            label: darwin-x86_64
            asset: coCN-darwin-x86_64
            build: 'clang -O2 -Wall -Wextra -o "$ASSET" co.c -lm -lpthread && chmod +x "$ASSET"'
            shell: bash
            deps: 'true'
          - os: macos-14
            label: darwin-arm64
            asset: coCN-darwin-arm64
            build: 'clang -O2 -Wall -Wextra -o "$ASSET" co.c -lm -lpthread && chmod +x "$ASSET"'
            shell: bash
            deps: 'true'
          # Windows：MSYS2 静态链接，仅依赖系统 DLL（必须用 msys2 shell，否则 "$ASSET" 在 PowerShell 下为空）
          - os: windows-latest
            label: windows-x86_64
            asset: coCN-windows-x86_64.exe
            build: 'gcc -O2 -Wall -Wextra -o "$ASSET" co.c -lm -lpthread -lshell32 -static && chmod +x "$ASSET"'
            shell: msys2 {0}
            deps: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: ${{ matrix.deps }}

      - name: 配置 MSYS2（仅 Windows）
        if: ${{ matrix.os == 'windows-latest' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: 构建 ${{ matrix.asset }}
        env:
          ASSET: ${{ matrix.asset }}
        shell: ${{ matrix.shell }}
        run: ${{ matrix.build }}

      - name: 冒烟测试（--版本）
        shell: ${{ matrix.shell }}
        run: ./${{ matrix.asset }} --版本

      - name: 解析目标 tag
        id: tag
        shell: ${{ matrix.shell }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 归档构建产物（供下载 / 补传）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: 上传二进制到 Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true   # 手动补传时 token 对既有 release 写入受限，失败不阻塞，产物仍由上方归档
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ matrix.asset }}